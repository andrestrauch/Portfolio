<section class="hero">
  <div class="content-wrapper">
    <section class="hero-img">
      <!-- <p>Bild</p> -->
      <img [src]="'assets/img/circle.png'" alt="Kreis" />
    </section>
    <section class="right-side">
      <section class="logo-icons">
        <section class="logo-name">
          <img [src]="'assets/icon/logo.png'" alt="Logo" />
          <p>A.Strauch</p>
          <p class="blue">developer</p>
        </section>
        <section class="icons">
          <img [src]="'assets/icon/mail.svg'" alt="Email" />
          <img [src]="'assets/icon/github.png'" alt="GitHub" />
          <img [src]="'assets/icon/linkedIn.png'" alt="LinkedIn" />
        </section>
      </section>
      <section class="name-section">
        <h1>Andre Strauch</h1>
        <h2>FRONTEND DEVELOPER</h2>
      </section>
      <section class="scroll-arrow">
        <button>
          <img [src]="'assets/icon/arrowDown.png'" alt="Arrow Down" />
        </button>
      </section>
    </section>
  </div>
</section>
