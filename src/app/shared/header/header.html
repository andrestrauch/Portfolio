<section class="header">
  <!-- <p>header works!</p> -->
  <div class="content-wrapper">
    <section class="logo">
      <img [src]="'assets/icon/logo2.png'" alt="Logo" />
      <p class="white">A.Strauch</p>
      <p>developer</p>
    </section>
    <section class="nav">
      <a href="#whyMeSection">
        <p>{{ 'header-whyMe' | translate }}</p>
      </a>
      <a href="#skillSection">
        <p>{{ 'header-skills' | translate }}</p>
      </a>
      <a href="#projectSection">
        <p>{{ 'header-projects' | translate }}</p>
      </a>

      <a href="#contactSection">
        <p>{{ 'header-contact' | translate }}</p>
      </a>
    </section>

    <section class="lang-btn">
      <button id="langToggle" class="mode-toggle">
        <span>
          <button id="deBtn" (click)="changeLanguage('de')"><p class="de">DE</p></button>
          <button id="enBtn" (click)="changeLanguage('en')"><p class="en">ENG</p></button>
        </span>
      </button>
    </section>
  </div>
</section>
